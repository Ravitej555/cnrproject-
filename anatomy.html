<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="description" content="An interactive, educational 3D atlas of the human body." />
    <title>Human Body Atlas – Interactive 3D</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/overflow.css" />
    <style>
      .back-nav-btn {
        position: fixed;
        top: 13px;
        left: 295px;
        height: 32px;
        z-index: 99999;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(24, 25, 30, 0.9);
        color: #f3f4f6;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(16px);
        padding: 0 16px;
        border-radius: 9999px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .back-nav-btn:hover {
        background: #ffffff;
        color: #0b0c0e;
        border-color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
      }
      @media (max-width: 800px) {
        .back-nav-btn {
          left: auto;
          right: 14px;
          top: 11px;
        }
      }

      /* Floating Bot Widget in 3D Atlas - Standalone Symbol */
      .floating-bot-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 72px;
        height: 72px;
        background: transparent;
        border: none;
        box-shadow: none;
        cursor: pointer;
        z-index: 99998;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
      }
      .floating-bot-btn:hover {
        transform: scale(1.12) translateY(-3px);
        filter: drop-shadow(0 8px 24px rgba(255, 255, 255, 0.45));
      }
      .floating-bot-btn.has-notification {
        animation: botPulseNotification 1.8s infinite ease-in-out;
      }
      @keyframes botPulseNotification {
        0%, 100% {
          filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.4));
          transform: scale(1);
        }
        50% {
          filter: drop-shadow(0 8px 26px rgba(56, 189, 248, 0.85));
          transform: scale(1.08);
        }
      }
      .floating-bot-btn img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
      }
      .anatomy-chat-window {
        display: none;
        position: fixed;
        bottom: 98px;
        right: 24px;
        width: min(560px, calc(100vw - 32px));
        height: min(720px, calc(100vh - 120px));
        background: linear-gradient(175deg, rgba(26, 30, 40, 0.97) 0%, rgba(14, 16, 22, 0.98) 100%);
        border: 1px solid rgba(203, 213, 225, 0.35);
        border-radius: 22px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 0 35px rgba(148, 163, 184, 0.15);

        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        z-index: 99999;
        flex-direction: column;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .anatomy-chat-window.open {
        display: flex;
        animation: chatFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes chatFadeIn {
        from { opacity: 0; transform: translateY(16px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .chat-header {
        padding: 13px 16px;
        background: linear-gradient(90deg, rgba(241, 245, 249, 0.08) 0%, rgba(148, 163, 184, 0.04) 100%);
        border-bottom: 1px solid rgba(203, 213, 225, 0.18);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .chat-title-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .chat-title-wrap img {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        border: 1px solid rgba(226, 232, 240, 0.5);
        padding: 3px;
        background: linear-gradient(135deg, rgba(241, 245, 249, 0.2), rgba(148, 163, 184, 0.1));
        object-fit: contain;
      }
      .chat-title {
        font-size: 13.5px;
        font-weight: 600;
        color: #f8fafc;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .chat-subtitle {
        font-size: 10.5px;
        color: #cbd5e1;
        margin: 2px 0 0;
        font-family: monospace;
      }
      .chat-header-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .chat-action-btn, .chat-close-btn {
        background: transparent;
        border: 0;
        color: #94a3b8;
        cursor: pointer;
        font-size: 14px;
        padding: 6px 8px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      .chat-action-btn:hover { color: #f8fafc; background: rgba(241, 245, 249, 0.12); }
      .chat-close-btn:hover { color: #fff; background: rgba(241, 245, 249, 0.12); }
      .chat-body {
        flex: 1;
        padding: 18px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        font-size: 13.5px;
        line-height: 1.6;
      }
      .chat-msg {
        display: flex;
        gap: 8px;
        max-width: 94%;
      }
      .chat-msg.bot { align-self: flex-start; }
      .chat-msg.user { align-self: flex-end; }
      .chat-bubble {
        padding: 14px 18px;
        border-radius: 16px;
        word-break: break-word;
      }
      .chat-msg.bot .chat-bubble {
        background: rgba(241, 245, 249, 0.08);
        border: 1px solid rgba(203, 213, 225, 0.22);
        color: #f1f5f9;
        border-bottom-left-radius: 4px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      }
      .chat-msg.user .chat-bubble {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        color: #0f172a;
        border-bottom-right-radius: 4px;
        font-weight: 500;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      }
      /* Chat formatting styles */
      .chat-bubble p {
        margin: 0 0 8px 0;
        line-height: 1.6;
      }
      .chat-bubble p:last-child {
        margin-bottom: 0;
      }
      .chat-bubble h4 {
        margin: 10px 0 6px 0;
        font-size: 13px;
        font-weight: 600;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .chat-bubble h4:first-child {
        margin-top: 0;
      }
      .chat-bubble strong {
        color: #38bdf8;
        font-weight: 600;
      }
      .chat-bubble ul, .chat-bubble ol {
        margin: 6px 0 10px 18px;
        padding: 0;
      }
      .chat-bubble li {
        margin-bottom: 4px;
        line-height: 1.55;
      }
      .chat-bubble li::marker {
        color: #38bdf8;
      }
      .chat-bubble .chat-tip {
        margin: 8px 0;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(6, 182, 212, 0.12);
        border: 1px solid rgba(6, 182, 212, 0.35);
        color: #a5f3fc;
        font-size: 11.5px;
        line-height: 1.5;
      }
      .chat-bubble code {
        background: rgba(255, 255, 255, 0.12);
        padding: 2px 5px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
        color: #67e8f9;
      }

      /* Quick interactive prompt pills - Silver styling */
      .chat-pills-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(226, 232, 240, 0.15);
      }
      .chat-pill-btn {
        background: rgba(241, 245, 249, 0.1);
        border: 1px solid rgba(203, 213, 225, 0.35);
        color: #e2e8f0;
        padding: 5px 11px;
        border-radius: 999px;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: left;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .chat-pill-btn:hover {
        background: rgba(241, 245, 249, 0.22);
        border-color: #f8fafc;
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 2px 10px rgba(226, 232, 240, 0.25);
      }
      /* Pulse lines loader form - Silver Platinum Edition */
      .pulse-lines-wrapper {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 18px;
        background: rgba(241, 245, 249, 0.06);
        border: 1px solid rgba(203, 213, 225, 0.3);
        border-radius: 16px;
        border-bottom-left-radius: 4px;
        width: 250px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35), 0 0 15px rgba(226, 232, 240, 0.12);
        backdrop-filter: blur(12px);
      }
      .pulse-wave-lines {
        display: flex;
        align-items: center;
        gap: 3.5px;
        height: 16px;
      }
      .p-wave {
        width: 3.5px;
        border-radius: 999px;
        background: linear-gradient(180deg, #f8fafc, #94a3b8);
        animation: pWaveMotion 1.2s ease-in-out infinite;
      }
      .p-wave-1 { height: 8px; animation-delay: 0.0s; }
      .p-wave-2 { height: 16px; animation-delay: 0.15s; }
      .p-wave-3 { height: 12px; animation-delay: 0.3s; }
      .p-wave-4 { height: 18px; animation-delay: 0.45s; }
      .p-wave-5 { height: 10px; animation-delay: 0.6s; }
      .p-wave-6 { height: 6px; animation-delay: 0.75s; }

      @keyframes pWaveMotion {
        0%, 100% { transform: scaleY(0.35); opacity: 0.45; }
        50% { transform: scaleY(1.15); opacity: 1; filter: drop-shadow(0 0 6px rgba(248, 250, 252, 0.8)); }
      }

      .pulse-skeleton-lines {
        display: flex;
        flex-direction: column;
        gap: 7px;
        width: 100%;
      }
      .pulse-line {
        height: 9px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(226, 232, 240, 0.12) 0%, rgba(248, 250, 252, 0.55) 50%, rgba(226, 232, 240, 0.12) 100%);
        background-size: 200% 100%;
        animation: pLineShimmer 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .pulse-line.line-1 { width: 92%; }
      .pulse-line.line-2 { width: 100%; animation-delay: 0.2s; }
      .pulse-line.line-3 { width: 68%; animation-delay: 0.4s; }

      @keyframes pLineShimmer {
        0% { background-position: 200% 0; opacity: 0.5; }
        50% { opacity: 1; }
        100% { background-position: -200% 0; opacity: 0.5; }
      }
      .chat-input-row {
        padding: 10px 12px;
        border-top: 1px solid rgba(226, 232, 240, 0.15);
        display: flex;
        gap: 8px;
        background: rgba(0,0,0,0.25);
      }
      .chat-input-row input {
        flex: 1;
        background: rgba(241, 245, 249, 0.08);
        border: 1px solid rgba(203, 213, 225, 0.25);
        border-radius: 10px;
        color: #fff;
        padding: 8px 12px;
        font-size: 12px;
        outline: none;
      }
      .chat-input-row input:focus {
        border-color: #cbd5e1;
        box-shadow: 0 0 10px rgba(226, 232, 240, 0.2);
      }
      .chat-input-row button {
        background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
        color: #0f172a;
        border: 0;
        border-radius: 10px;
        padding: 0 14px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <a href="./" class="back-nav-btn">
      ← Back to Museum
    </a>
    <div id="app"></div>

    <!-- Floating Chatbot Widget Trigger -->
    <button id="floatingBotBtn" class="floating-bot-btn" title="Open Anatomy & Museum AI Guide">
      <img src="./assets/bot-icon.png" alt="AI Skull" />
    </button>

    <!-- Chat Window Modal -->
    <div id="anatomyChatWindow" class="anatomy-chat-window">
      <div class="chat-header">
        <div class="chat-title-wrap">
          <img src="./assets/bot-icon.png" alt="AI Skull" />
          <div>
            <h4 class="chat-title">
              Anatomy & RAG Guide
              <span style="width: 7px; height: 7px; border-radius: 50%; background: #10b981; display: inline-block;"></span>
            </h4>
            <p class="chat-subtitle">Interactive 3D Body Assistant</p>
          </div>
        </div>
        <div class="chat-header-actions">
          <button id="chatExportBtn" class="chat-action-btn" title="Download Chat History (.txt)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button id="chatClearBtn" class="chat-action-btn" title="Clear Chat">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
          <button id="chatCloseBtn" class="chat-close-btn" title="Close">✕</button>
        </div>
      </div>
      <div id="chatMessages" class="chat-body">
        <div class="chat-msg bot">
          <div class="chat-bubble">
            <h4>👋 3D Anatomy & Health AI Guide</h4>
            <p>Welcome! Ask me any medical or anatomical question, or click any 3D body structure (like the <strong>Leg</strong>, <strong>Femur</strong>, <strong>Heart</strong>, or <strong>Brain</strong>) to explore its biomechanics.</p>
          </div>
        </div>
      </div>
      <form id="chatForm" class="chat-input-row">
        <input id="chatInput" type="text" placeholder="Ask about anatomy or click any model part..." autocomplete="off" />
        <button type="submit">➤</button>
      </form>
    </div>

    <script type="module">
      const botBtn = document.getElementById('floatingBotBtn');
      const chatWin = document.getElementById('anatomyChatWindow');
      const closeBtn = document.getElementById('chatCloseBtn');
      const clearBtn = document.getElementById('chatClearBtn');
      const exportBtn = document.getElementById('chatExportBtn');
      const chatForm = document.getElementById('chatForm');
      const chatInput = document.getElementById('chatInput');
      const chatMsgs = document.getElementById('chatMessages');

      let currentPendingPart = null;

      const chatHistory = [
        { role: 'bot', text: "Hello! 👋 I'm your 3D Anatomy & History AI Guide. Click on any 3D body structure (like the Leg, Femur, Heart, or Brain). I will always ask for your permission before providing an explanation!" }
      ];

      botBtn.addEventListener('click', () => {
        chatWin.classList.toggle('open');
        botBtn.classList.remove('has-notification');
        if (chatWin.classList.contains('open')) {
          chatInput.focus();
          // If a body part was selected while chat was closed, show the permission prompt now
          if (currentPendingPart && !currentPendingPart.prompted) {
            currentPendingPart.prompted = true;
            showPartPermissionPrompt(currentPendingPart);
          }
        }
      });

      closeBtn.addEventListener('click', () => {
        chatWin.classList.remove('open');
      });

      clearBtn.addEventListener('click', () => {
        chatMsgs.innerHTML = '';
        chatHistory.length = 0;
        currentPendingPart = null;
        addMsg("Chat cleared! Click on any 3D body structure or ask a question.", 'bot');
      });

      // Export chat transcript
      exportBtn.addEventListener('click', () => {
        const timestamp = new Date().toLocaleString();
        let transcript = "=================================================================\\n";
        transcript += "3D HUMAN ANATOMY ATLAS & NATURAL HISTORY - CHAT TRANSCRIPT\\n";
        transcript += "Exported: " + timestamp + "\\n";
        transcript += "=================================================================\\n\\n";

        chatHistory.forEach((msg, idx) => {
          transcript += "-----------------------------------------------------------------\\n";
          transcript += "[#" + (idx + 1) + "] " + (msg.role === 'user' ? 'USER' : 'AI GUIDE') + ":\\n";
          transcript += "-----------------------------------------------------------------\\n";
          transcript += msg.text + "\\n\\n";
        });

        transcript += "=================================================================\\n";
        transcript += "End of Chat Log\\n";

        const blob = new Blob([transcript], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "Anatomy_AI_Chat_Export_" + Date.now() + ".txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      // Formatter for markdown to HTML (headings, lists, tips, paragraphs)
      function formatParagraphs(text) {
        if (!text) return '';
        const cleanText = text.replace(/\\n/g, '\n');
        const blocks = cleanText.split(/\n\s*\n/);

        return blocks.map(block => {
          const trimmed = block.trim();
          if (!trimmed) return '';

          // 1. Standalone single-line heading
          if (/^#{1,4}\s+/.test(trimmed) && !trimmed.includes('\n')) {
            const h = trimmed.replace(/^#{1,4}\s+/, '');
            return `<h4>${formatInline(h)}</h4>`;
          }

          // 2. Standalone callout tip
          if (trimmed.startsWith('💡') || /^(\*\*Tip|\*Tip|Tip:)/i.test(trimmed)) {
            return `<div class="chat-tip">${formatInline(trimmed)}</div>`;
          }

          // 3. Multi-line block processing
          const lines = trimmed.split('\n');
          let out = '';
          let inList = false;
          let inNumbered = false;

          const closeList = () => {
            if (inList) { out += '</ul>'; inList = false; }
            if (inNumbered) { out += '</ol>'; inNumbered = false; }
          };

          lines.forEach(line => {
            const lTrim = line.trim();
            if (!lTrim) return;

            if (/^#{1,4}\s+/.test(lTrim)) {
              closeList();
              const h = lTrim.replace(/^#{1,4}\s+/, '');
              out += `<h4>${formatInline(h)}</h4>`;
            } else if (/^\s*[-*•]\s+/.test(line)) {
              if (inNumbered) closeList();
              if (!inList) { out += '<ul>'; inList = true; }
              const item = line.replace(/^\s*[-*•]\s+/, '');
              out += `<li>${formatInline(item)}</li>`;
            } else if (/^\s*\d+[\.\)]\s+/.test(line)) {
              if (inList) closeList();
              if (!inNumbered) { out += '<ol>'; inNumbered = true; }
              const item = line.replace(/^\s*\d+[\.\)]\s+/, '');
              out += `<li>${formatInline(item)}</li>`;
            } else if (lTrim.startsWith('💡') || /^(\*\*Tip|\*Tip|Tip:)/i.test(lTrim)) {
              closeList();
              out += `<div class="chat-tip">${formatInline(lTrim)}</div>`;
            } else {
              closeList();
              out += `<p>${formatInline(lTrim)}</p>`;
            }
          });

          closeList();
          return out;
        }).join('');
      }

      function formatInline(str) {
        return str
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/`(.*?)`/g, '<code>$1</code>');
      }

      function addMsg(text, sender) {
        chatHistory.push({ role: sender, text: text });
        const wrap = document.createElement('div');
        wrap.className = 'chat-msg ' + sender;
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble';

        if (sender === 'bot') {
          bubble.innerHTML = formatParagraphs(text);
        } else {
          bubble.textContent = text;
        }

        wrap.appendChild(bubble);
        chatMsgs.appendChild(wrap);
        chatMsgs.scrollTop = chatMsgs.scrollHeight;
      }

      function addMsgWithPills(text, pills = []) {
        chatHistory.push({ role: 'bot', text: text });
        const wrap = document.createElement('div');
        wrap.className = 'chat-msg bot';
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble';
        bubble.innerHTML = formatParagraphs(text);

        if (pills && pills.length > 0) {
          const pillsRow = document.createElement('div');
          pillsRow.className = 'chat-pills-row';
          pills.forEach(p => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'chat-pill-btn';
            btn.innerHTML = p.label;
            btn.onclick = () => {
              if (p.action === 'dismiss') {
                currentPendingPart = null;
                addMsg("No problem! Feel free to explore the 3D model, and let me know whenever you'd like an explanation.", 'bot');
              } else if (p.prompt) {
                currentPendingPart = null;
                chatInput.value = p.prompt;
                chatForm.dispatchEvent(new Event('submit'));
              }
            };
            pillsRow.appendChild(btn);
          });
          bubble.appendChild(pillsRow);
        }

        wrap.appendChild(bubble);
        chatMsgs.appendChild(wrap);
        chatMsgs.scrollTop = chatMsgs.scrollHeight;
      }

      function showPulseLoader() {
        const wrap = document.createElement('div');
        wrap.className = 'chat-msg bot';
        wrap.id = 'activePulseLoader';
        wrap.innerHTML = `
          <div class="pulse-lines-wrapper">
            <div class="pulse-wave-lines">
              <span class="p-wave p-wave-1"></span>
              <span class="p-wave p-wave-2"></span>
              <span class="p-wave p-wave-3"></span>
              <span class="p-wave p-wave-4"></span>
              <span class="p-wave p-wave-5"></span>
              <span class="p-wave p-wave-6"></span>
            </div>
            <div class="pulse-skeleton-lines">
              <div class="pulse-line line-1"></div>
              <div class="pulse-line line-2"></div>
              <div class="pulse-line line-3"></div>
            </div>
          </div>
        `;
        chatMsgs.appendChild(wrap);
        chatMsgs.scrollTop = chatMsgs.scrollHeight;
      }

      function removePulseLoader() {
        const loader = document.getElementById('activePulseLoader');
        if (loader) loader.remove();
      }

      // Structured response for Leg anatomy and mechanics
      function getLegGeminiResponse(partName = 'Leg') {
        return `### 🦵 Human Lower Limb & Locomotion

The human lower limb is an extraordinary biomechanical marvel engineered for bipedal locomotion, shock absorption, and high-impact load bearing:

- **Femur (Thigh Bone):** The longest and strongest bone in the human skeleton, engineered to withstand compressive kinetic forces exceeding **30× body weight** during sprint and jump impacts. Its angled neck safely transfers axial torso loads to the knee.
- **Tibia & Fibula:** The parallel shin framework; the tibia bears over **85% of lower leg weight**, while the lateral fibula stabilizes the ankle mortise and anchors peroneal muscles.
- **Knee Joint Synovial Hinge:** A complex articulation cushioned by medial and lateral fibrocartilage menisci. The **patella** (kneecap) acts as a biomechanical pulley, increasing quadriceps extension leverage by **up to 30%**.
- **Cruciate & Collateral Ligaments:** The ACL, PCL, MCL, and LCL create a four-bar kinetic linkage preventing rotational and shear dislocation.
- **Achilles Tendon Recoil:** The body's thickest tendon, functioning as a high-tension elastic spring that stores and returns kinetic recoil energy with every stride.
- **Neurovascular Supply:** Perfusion is supplied by the high-pressure femoral artery, with motor control driven by the **sciatic nerve** (the body's largest nerve trunk).

💡 **Interactive 3D Tip:** Toggle the **Muscular** and **Skeletal** layers in the sidebar to isolate the femur, patella, and quad tendon in 3D!`;
      }

      // Universal ChatGPT / Gemini response generator (Structured Markdown)
      function getAnswer(q) {
        const query = q.toLowerCase().trim();

        // 1. General Greetings & Capabilities
        if (/^(hi|hello|hey|greetings|good morning|good evening|who are you|what can you do|help|start)/i.test(query)) {
          return `### 👋 Welcome to the 3D Anatomy & Health AI Guide\nI am your interactive intelligence guide across human physiology, vital health analytics, and museum specimens.\n\n**What I can help you explore:**\n- **🦴 3D Human Anatomy:** 206 articulated bones, muscle biomechanics, circulatory networks, and neural pathways.\n- **📊 AI Health Advisor:** Real-time analysis of vitals (Heart Rate, BP, SpO₂, BMI) paired with ambient Air Quality Index (AQI).\n- **🦕 Prehistoric Exhibits:** Dinosaurs, fossil biomechanics, and natural history specimens.\n- **📄 Document Intelligence:** Upload research or medical PDFs to index them and ask cited questions!\n\n💡 **Tip:** Ask me any medical or anatomical question, or click any 3D body part to explore!`;
        }

        // 2. Prehistoric Specimens / Dinosaurs / Fossils / Paleontology
        if (/dino|fossil|specimen|trex|t-rex|tyrannosaur|triceratop|pterodactyl|jurassic|cretaceous|paleontol|amber|extinct|prehistoric/i.test(query)) {
          return `### 🦖 Prehistoric Specimens & Paleontology Exhibit\n\nOur museum collection features iconic prehistoric specimens preserved across geological eras:\n\n- **Tyrannosaurus Rex:** Late Cretaceous apex predator with a massive skull engineered for a bone-crushing bite force exceeding **35,000 Newtons**.\n- **Triceratops Prorsus:** Heavily armored ceratopsian possessing a fused solid-bone parietosquamosal frill and three defensive rostral horns.\n- **Pterodactyl & Pterosaurs:** Flying Mesozoic archosaurs with hollow pneumatic bones and elongated fourth wing fingers supporting membranous flight patagia.\n- **Fossilization Science:** Permineralization replaces organic bone matrices with silica and calcite over millions of years under anoxic sedimentary conditions.\n\n💡 **Museum Tip:** Scroll down to the **Prehistoric Specimens & Dinosaurs** gallery on the main landing page to view our curated 3D exhibits!`;
        }

        // 3. Cardiovascular System / Heart Rate / Blood Pressure
        if (/heart|cardio|bp|blood pressure|pulse|circulation|artery|vein|chest pain|palpitations|cardiovascular/i.test(query)) {
          return `### 🫀 Cardiovascular System & Hemodynamics\n\nThe cardiovascular system operates as a continuous closed-loop hydraulic circuit anchored by the heart:\n\n- **Cardiac Output:** Pumps approximately **5 liters of blood per minute** through an arterial and venous network spanning nearly **60,000 miles**.\n- **Dual Ventricular Circuits:** The high-pressure left ventricle drives oxygenated blood into systemic circulation (**120/80 mmHg** normal baseline), while the right ventricle directs venous blood into low-pressure pulmonary capillaries for gas exchange.\n- **Clinical Vital Metrics:** Normal adult resting heart rate is **60–100 bpm**. Sustained blood pressure exceeding **130/80 mmHg** indicates stage-1 arterial hypertension.\n- **Air Quality Link (PM2.5):** Ultrafine particulates cross alveolar membranes into systemic blood, inducing endothelial inflammation, arterial stiffening, and elevated myocardial strain.\n\n💡 **Clinical Tip:** Open the **AI Health Advisor** in the top navigation to evaluate your cardiovascular vulnerability score based on vitals and local AQI!`;
        }

        // 4. Respiratory System / Lungs / AQI / Oxygen / Asthma
        if (/lung|respiratory|breath|air|aqi|pm2\.5|smok|asthma|cough|oxygen|spo2|alveoli/i.test(query)) {
          return `### 🫁 Respiratory Mechanics & Air Quality Impact\n\nThe respiratory system maximizes gas exchange through microscopic alveolar architecture:\n\n- **Alveolar Gas Exchange:** Over **300 million micro-alveoli** produce a vast gas exchange surface of approximately **70 m²** (roughly half a tennis court).\n- **Diaphragm Biomechanics:** Inhalation is powered by active diaphragmatic contraction, creating negative intrapleural pressure that draws atmospheric air into pulmonary lobes.\n- **Arterial Oxygenation (SpO₂):** Normal arterial blood oxygen saturation ranges between **95% and 100%**.\n- **Environmental AQI Tiers:**\n  • **0–50 (Good):** Optimal pulmonary respiratory balance.\n  • **101–150 (Moderate/Sensitive):** Early airway hyper-reactivity in asthma patients.\n  • **151–200+ (Unhealthy):** Deep PM2.5 penetration triggers bronchospasm, mucus hypersecretion, and ciliary paralysis.\n\n💡 **Interactive 3D Tip:** Select the *Smog & Respiratory* scenario in the AI Health Advisor to highlight bronchial and lung risk in 3D!`;
        }

        // 5. Brain / Nerves / Nervous System / Stress / Headache
        if (/brain|nerve|nervous|headache|migraine|dizz|stress|sleep|fatigue|memory|spine|neuron|synapses/i.test(query)) {
          return `### 🧠 Nervous System & Neuro-Autonomic Regulation\n\nThe nervous system forms the master electrochemical signaling network of the human body:\n\n- **86 Billion Neurons:** Transmit electrical action potentials across synaptic clefts using specialized neurotransmitters (acetylcholine, dopamine, serotonin, GABA).\n- **Central Nervous System (CNS):** The brain and spinal cord orchestrate executive cognition, sensory processing, and autonomic reflexes.\n- **Autonomic Dual Balance:**\n  • **Sympathetic Division:** Initiates "Fight-or-Flight" responses, accelerating heart rate, dilating bronchioles, and mobilizing cortisol.\n  • **Parasympathetic Division:** Coordinates "Rest-and-Digest" recovery via the vagus nerve, reducing heart rate and facilitating cellular regeneration.\n- **Cephalea & Neural Strain:** Headaches, dizziness, and cognitive fatigue commonly reflect cerebral hypoperfusion, dehydration, or prolonged autonomic stress.\n\n💡 **Interactive 3D Tip:** Toggle the **Nervous System** layer in the left sidebar to trace major cranial nerves and the spinal cord in 3D!`;
        }

        // 6. Skeleton / Bones / Muscles / Joints / Leg / Femur
        if (/skeleton|bone|muscle|joint|femur|leg|knee|patella|spine|skull|rib|cartilage|tendon/i.test(query)) {
          return `### 🦴 Musculoskeletal Framework & Joint Biomechanics\n\nThe adult musculoskeletal system provides structural scaffolding, organ protection, and locomotive leverage:\n\n- **206 Articulated Bones:** Divided into the **Axial Skeleton** (80 bones: skull, vertebrae, ribcage) and the **Appendicular Skeleton** (126 bones: limbs, pectoral and pelvic girdles).\n- **600+ Skeletal Muscles:** Connected by dense collagenous tendons, generating dynamic force and stabilizing joints under kinetic loads.\n- **Femur Biomechanics:** The longest and strongest bone in the body, engineered to absorb compressive forces exceeding **30× body weight** during high-impact locomotion.\n- **Knee Joint Mechanics:** A complex synovial hinge stabilized by the cruciate (**ACL/PCL**) and collateral (**MCL/LCL**) ligaments, cushioned by the medial and lateral menisci.\n- **Patellar Leverage:** The sesamoid patella functions as a biomechanical pulley that increases quadriceps leverage by **up to 30%** during leg extension.\n- **Achilles Tendon Spring:** The body's strongest tendon, acting as a high-tension elastic spring storing and releasing kinetic recoil energy during gait.\n\n💡 **Interactive 3D Tip:** Click directly on any bone in the 3D viewport or turn off the **Skin** and **Muscular** layers to inspect the skeleton in 3D!`;
        }

        // 7. Digestive / Stomach / Liver / Kidneys / Urinary
        if (/digest|stomach|gut|liver|kidney|renal|urine|diet|food|metabol|nausea|pancreas|intestine/i.test(query)) {
          return `### 🧪 Digestive & Renal Physiological Systems\n\nThe digestive and excretory systems process nutrients, detoxify waste, and regulate fluid equilibrium:\n\n- **Gastrointestinal Hydrolysis:** Food is broken down in the stomach by hydrochloric acid (pH 1.5–2.0) and pepsin before passing into the small intestine for enzymatic digestion and nutrient absorption.\n- **Hepatic & Pancreatic Metabolism:** The liver synthesizes bile for lipid emulsification, while the pancreas delivers digestive enzymes and bicarbonate into the duodenum.\n- **Nephron Plasma Filtration:** Paired kidneys contain approximately **2 million nephrons** that filter **180 liters of blood plasma daily**, extracting metabolic waste while reclaiming electrolytes.\n- **Systemic Regulation:** The kidneys maintain fluid balance, acid-base pH, systemic blood pressure (via renin), and erythrocyte production (via erythropoietin).\n\n💡 **Clinical Tip:** Review the **Metabolic & GI Risk Index** in the AI Health Advisor to evaluate digestion and hydration metrics!`;
        }

        // 8. Endocrine System & Hormones (Thyroid, Insulin, Cortisol)
        if (/endocrine|hormone|insulin|thyroid|cortisol|pancreas|diabetes|gland|adrenal|estrogen|testosterone/i.test(query)) {
          return `### 🧬 Endocrine System & Hormonal Coordination\n\nThe endocrine system regulates long-term metabolic homeostasis, growth, and stress response via endocrine messengers:\n\n- **Hypothalamus-Pituitary Axis:** The master neuroendocrine gland coordinating thyroid, adrenal, and reproductive hormone cascades.\n- **Glucose Regulation:** Pancreatic beta cells release **insulin** to promote cellular glucose storage, while alpha cells secrete **glucagon** during fasting.\n- **Stress & Alertness:** The adrenal cortex secretes **cortisol** for glucose mobilization, and the adrenal medulla releases **adrenaline/epinephrine** for acute kinetic readiness.\n- **Basal Metabolic Rate:** Thyroid hormones (T3 and T4) govern cellular oxygen consumption and temperature regulation across all tissues.`;
        }

        // 9. Immune & Lymphatic System (Lymph nodes, Infection, Antibodies)
        if (/immune|lymph|white blood|antibody|vaccine|infection|swelling|spleen|leukocyte|fever/i.test(query)) {
          return `### 🛡️ Immune Defense & Lymphatic Network\n\nThe immune and lymphatic networks collaborate to defend host tissues and regulate interstitial fluid:\n\n- **Innate Barrier Defense:** Rapid, non-specific protection provided by physical epithelium, neutrophils, and tissue macrophages.\n- **Adaptive Immunological Memory:** Tailored antigen defense mediated by **T-lymphocytes** (cell-mediated cytotoxicity) and **B-lymphocytes** (targeted antibody production).\n- **Lymphatic Filtration:** Interstitial fluid is collected and routed through hundreds of lymph nodes where resident leukocytes neutralize biological pathogens before fluid returns to venous blood.`;
        }

        // 10. Skin & Integumentary System
        if (/skin|dermis|epidermis|integumentary|hair|nail|sweat|collagen|temperature/i.test(query)) {
          return `### 🧴 Integumentary System & Thermoregulation\n\nCovering approximately **2 m² in adults**, the skin forms the body's primary protective envelope:\n\n- **Epidermis & Dermis:** Stratified keratinized outer epithelium blocks pathogens and fluid loss, anchored by a tough vascular dermis rich in collagen and elastin.\n- **Thermoregulation:** Dermal blood vessel dilation/constriction and eccrine sweat evaporation stabilize core body temperature near **37°C (98.6°F)**.\n- **Sensory & Synthesis:** Houses dense tactile and thermal receptors, and synthesizes Vitamin D precursors upon solar ultraviolet-B exposure.`;
        }

        // 11. Universal Science, Health & Medical Fallback Generator
        return `### 🌐 Human Physiology & Anatomical Overview\n\nThe human body operates as a highly coordinated biological ecosystem where 11 distinct organ systems interact to maintain physiological homeostasis for query "${q}":\n\n- **Structural & Locomotive:** Musculoskeletal framework (206 bones, 600+ muscles) provides mechanical support and kinetic force.\n- **Circulatory & Respiratory:** Cardiovascular and respiratory circuits supply continuous oxygenated perfusion across tissues.\n- **Control & Communication:** Nervous and endocrine systems orchestrate autonomic feedback and hormonal balance.\n\n💡 **Interactive Tip:** Click any bone or organ directly in the 3D viewport to inspect its anatomy, or open the **AI Health Advisor** in the top navigation bar to evaluate vitals and local air quality!`;
      }

      // Helper function to render permission prompt for a clicked 3D body part
      function showPartPermissionPrompt(part) {
        const { name, isLeg } = part;
        if (isLeg) {
          const permissionPrompt = `🦴 **You selected the ${name || 'Leg'}!**\n\nWould you like to know more about how its anatomy and biomechanics work?`;
          const pills = [
            { 
              label: '✅ Yes, explain lower limb', 
              prompt: 'Yes, explain the complete anatomy, biomechanics, and locomotive function of the human leg.' 
            },
            { 
              label: '🦴 Explain Femur & Knee Joint', 
              prompt: 'Explain the femur bone and knee joint mechanics of the human leg.' 
            },
            { 
              label: '🏃 Explain Muscles & Tendons', 
              prompt: 'Explain the quadriceps, hamstrings, and Achilles tendon of the human leg.' 
            },
            { 
              label: '✕ No, thanks', 
              action: 'dismiss' 
            }
          ];
          addMsgWithPills(permissionPrompt, pills);
        } else {
          const permissionPrompt = `🔍 **You selected: ${name || 'Body Structure'}!**\n\nWould you like to know more about how it functions?`;
          const pills = [
            { 
              label: '✅ Yes, explain structure', 
              prompt: `Explain the physiological function, structure, and clinical importance of the ${name}.` 
            },
            { 
              label: '✕ No, thanks', 
              action: 'dismiss' 
            }
          ];
          addMsgWithPills(permissionPrompt, pills);
        }
      }

      // ─── 3D Model Click Handler ───
      // NOTE: Clicking the 3D model does NOT automatically pop open the chatbot window.
      // It sets the selected part context and pulses the bot button so the user can open it when ready!
      let lastSelectedPartTime = 0;
      window.addEventListener('anatomy:select-part', (e) => {
        const now = Date.now();
        // Debounce repeated double-events within 400ms
        if (now - lastSelectedPartTime < 400) return;
        lastSelectedPartTime = now;

        const { id, name, region, isLeg } = e.detail;
        currentPendingPart = { id, name, region, isLeg, prompted: false };

        // Pulse the floating button so user notices the bot is ready
        botBtn.classList.add('has-notification');

        // Only show prompt immediately if the chat window is ALREADY open
        if (chatWin.classList.contains('open')) {
          currentPendingPart.prompted = true;
          botBtn.classList.remove('has-notification');
          showPartPermissionPrompt(currentPendingPart);
        }
      });

      // Submit Form
      chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        let text = chatInput.value.trim();
        if (!text) return;

        // If user typed "yes" or "yeah" while a part was pending permission:
        if (currentPendingPart && /^(yes|yeah|sure|yep|y|tell me more|ok|okay)$/i.test(text)) {
          if (currentPendingPart.isLeg) {
            text = 'Yes, explain the complete anatomy, biomechanics, and locomotive function of the human leg.';
          } else {
            text = `Explain the physiological function and structure of the ${currentPendingPart.name}.`;
          }
        }
        currentPendingPart = null;

        addMsg(text, 'user');
        chatInput.value = '';

        // Show pulse lines form loader
        showPulseLoader();

        // Try FastAPI
        try {
          const res = await fetch('http://127.0.0.1:8000/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              question: `${text}\n\n(Provide a clear, engaging, and well-structured response with key anatomical highlights, bullet points, numerals for metrics, and clinical/interactive insights where helpful.)`
            }),
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.answer) {
              removePulseLoader();
              addMsg(data.answer, 'bot');
              return;
            }
          }
        } catch {}


        // Fallback with minimal delay for instantaneous response
        setTimeout(() => {
          removePulseLoader();
          addMsg(getAnswer(text), 'bot');
        }, 120);
      });

    </script>

    <script type="module" src="/src/main.js"></script>
